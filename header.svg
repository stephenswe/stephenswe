<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cardClip">
      <rect x="10" y="10" width="880" height="220" rx="24"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="900" height="260" fill="#09090B"/>

  <rect x="10" y="10" width="880" height="220" rx="24" fill="#141414" stroke="#DC2626" stroke-width="2"/>

  <g clip-path="url(#cardClip)" stroke="#A1A1AA" stroke-width="0.6" opacity="0.16">
    <line x1="40" y1="20" x2="160" y2="90"/>
    <line x1="160" y1="90" x2="90" y2="180"/>
    <line x1="90" y1="180" x2="40" y2="20"/>
    <line x1="160" y1="90" x2="260" y2="40"/>
    <line x1="260" y1="40" x2="320" y2="140"/>
    <line x1="320" y1="140" x2="160" y2="90"/>
    <line x1="90" y1="180" x2="200" y2="220"/>
    <line x1="200" y1="220" x2="320" y2="140"/>
    <line x1="20" y1="200" x2="90" y2="180"/>
    <line x1="260" y1="40" x2="220" y2="-10"/>
  </g>
  <g clip-path="url(#cardClip)" fill="#A1A1AA" opacity="0.35">
    <circle cx="40" cy="20" r="2.5"/>
    <circle cx="160" cy="90" r="2.5"/>
    <circle cx="90" cy="180" r="2.5"/>
    <circle cx="260" cy="40" r="2.5"/>
    <circle cx="320" cy="140" r="2.5"/>
    <circle cx="200" cy="220" r="2.5"/>
    <circle cx="20" cy="200" r="2.5"/>
  </g>

  <text x="55" y="115" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#F8FAFC">Hi 👋, I am Stephen Michael</text>

  <text x="57" y="155" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-style="italic" font-weight="600" fill="#DC2626">Software Engineer &amp;&amp; Data (Engineer, Scientist, Analyst)</text>

  <line x1="55" y1="180" x2="470" y2="180" stroke="#27272A" stroke-width="1"/>
  <text x="55" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#A1A1AA">Learning, building and innovating.</text>

  <g transform="translate(610,45)">
    <rect x="0" y="0" width="230" height="150" rx="10" fill="#09090B" stroke="#27272A" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="26" rx="10" fill="#1A1A1D"/>
    <rect x="0" y="16" width="230" height="10" fill="#1A1A1D"/>
    <circle cx="16" cy="13" r="5" fill="#DC2626"/>
    <circle cx="34" cy="13" r="5" fill="#3F3F46"/>
    <circle cx="52" cy="13" r="5" fill="#3F3F46"/>

    <text x="14" y="47" font-family="Consolas, Menlo, monospace" font-size="12" fill="#A1A1AA">const dev = {</text>
    <text x="26" y="65" font-family="Consolas, Menlo, monospace" font-size="12" fill="#F8FAFC">name: <tspan fill="#EF4444">'Stephen'</tspan>,</text>
    <text x="26" y="83" font-family="Consolas, Menlo, monospace" font-size="12" fill="#F8FAFC">role: <tspan fill="#EF4444">'engineer'</tspan>,</text>
    <text x="26" y="101" font-family="Consolas, Menlo, monospace" font-size="12" fill="#F8FAFC">learning: <tspan fill="#EF4444">true</tspan></text>
    <text x="14" y="119" font-family="Consolas, Menlo, monospace" font-size="12" fill="#A1A1AA">};</text>

    <rect x="180" y="112" width="9" height="1" fill="#DC2626">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(150,-14)">
      <rect x="0" y="30" width="14" height="30" rx="2" fill="#DC2626"/>
      <rect x="18" y="18" width="14" height="42" rx="2" fill="#EF4444"/>
      <rect x="36" y="6" width="14" height="54" rx="2" fill="#DC2626"/>
      <rect x="54" y="24" width="14" height="36" rx="2" fill="#EF4444"/>
    </g>
  </g>
</svg>
